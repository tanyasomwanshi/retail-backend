name: CI CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t retail-backend .

      # -----------------------
      # DEPLOY TO EC2
      # -----------------------

      # - name: Deploy to EC2
  uses: appleboy/ssh-action@v1
  with:
    host: ${{ secrets.EC2_HOST }}
    username: ${{ secrets.EC2_USER }}
    key: ${{ secrets.EC2_KEY }}
    script: |

      # Kill any container using port 5000
      docker ps -q --filter "publish=5000" | xargs -r docker stop
      docker ps -aq --filter "publish=5000" | xargs -r docker rm

      # Remove old project folder completely
      rm -rf retail-backend

      # Fresh clone
      git clone https://github.com/tanyasomwanshi/retail-backend.git
      cd retail-backend

      # Build image
      docker build -t retail-backend .

      # Run container
      docker run -d -p 5000:5000 --name retail retail-backend
